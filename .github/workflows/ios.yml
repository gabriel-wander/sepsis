name: iOS Build & Test

# Repo público: Actions macOS é gratuito/ilimitado, então o CI roda a cada push.
on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # 'test' já compila o app e os alvos de teste — uma etapa só economiza minutos.
      - name: Build & Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project SepseApp/SepseApp.xcodeproj \
            -scheme SepseApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
