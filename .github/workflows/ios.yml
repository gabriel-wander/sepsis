name: iOS Build & Test

# Econômico: runner macOS consome 10x dos minutos de Actions (repo privado).
# Por isso o CI roda sob demanda (workflow_dispatch) e em push para main —
# não em cada push de feature branch. Dispare manualmente quando quiser validar.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # 'test' já compila o app e os alvos de teste — uma etapa só economiza minutos.
      - name: Build & Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project SepseApp/SepseApp.xcodeproj \
            -scheme SepseApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
